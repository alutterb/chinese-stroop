<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaderboard — Chinese Stroop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-pattern" aria-hidden="true"></div>
    <main class="shell">
      <nav class="site-nav" aria-label="Site">
        <a class="site-nav__link" href="./index.html">Play</a>
        <span class="site-nav__sep" aria-hidden="true">·</span>
        <span class="site-nav__here">Leaderboard</span>
      </nav>
      <header class="top">
        <h1 class="title">Leaderboard</h1>
        <p id="lb-subtitle" class="subtitle">Loading…</p>
      </header>

      <section class="panel card lb-card" aria-labelledby="lb-heading">
        <h2 id="lb-heading" class="panel-title visually-hidden">Scores by level</h2>
        <div class="lb-toolbar">
          <p id="lb-status" class="lb-status muted" aria-live="polite"></p>
          <button type="button" class="btn ghost lb-refresh" id="lb-refresh">Refresh</button>
        </div>
        <div class="lb-tabs" role="tablist" aria-label="Level">
          <button type="button" class="lb-tab lb-tab--active" id="lb-tab-1" role="tab" aria-selected="true" aria-controls="lb-panel-1">
            Level 1
          </button>
          <button type="button" class="lb-tab" id="lb-tab-2" role="tab" aria-selected="false" aria-controls="lb-panel-2">
            Level 2
          </button>
          <button type="button" class="lb-tab" id="lb-tab-3" role="tab" aria-selected="false" aria-controls="lb-panel-3">
            Level 3
          </button>
        </div>

        <div id="lb-panel-1" class="lb-panel" role="tabpanel" aria-labelledby="lb-tab-1">
          <table class="lb-table">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Accuracy</th>
                <th scope="col">Time</th>
              </tr>
            </thead>
            <tbody id="lb-tbody-1"></tbody>
          </table>
        </div>
        <div id="lb-panel-2" class="lb-panel hidden" role="tabpanel" aria-labelledby="lb-tab-2">
          <table class="lb-table">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Accuracy</th>
                <th scope="col">Time</th>
              </tr>
            </thead>
            <tbody id="lb-tbody-2"></tbody>
          </table>
        </div>
        <div id="lb-panel-3" class="lb-panel hidden" role="tabpanel" aria-labelledby="lb-tab-3">
          <table class="lb-table">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Accuracy</th>
                <th scope="col">Time</th>
              </tr>
            </thead>
            <tbody id="lb-tbody-3"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="./api-config.js"></script>
    <script src="./leaderboard-storage.js"></script>
    <script src="./leaderboard-api.js"></script>
    <script src="./leaderboard-page.js"></script>
  </body>
</html>
